name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budgetradar
          POSTGRES_PASSWORD: budgetradar
          POSTGRES_DB: budgetradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetradar -d budgetradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://budgetradar:budgetradar@localhost:5432/budgetradar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test
        run: pytest
